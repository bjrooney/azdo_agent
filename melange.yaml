package:
  name: azdo-agent-tools
  version: 0.1.0
  epoch: 0
  description: Azure DevOps agent tools and startup script
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bash
      - coreutils
      - curl
      - git
      - icu-libs
      - jq
      - make
      - melange=0.45.3-r1
      - ncurses
      - openssh
      - py3-pip
      - python3
      - unzip
      - yq

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - bash
      - ca-certificates-bundle
      - coreutils
      - curl
      - jq
      - python3
      - py3-pip
      - unzip

pipeline:
  - runs: |
      set -eux

      install -d "${{targets.destdir}}/azp" "${{targets.destdir}}/usr/bin"
      install -m 0755 start.sh "${{targets.destdir}}/azp/start.sh"

      curl -fsSL -o "${{targets.destdir}}/usr/bin/kubectl" \
        "https://dl.k8s.io/release/v1.35.2/bin/linux/amd64/kubectl"
      echo "924eb50779153f20cb668117d141440b95df2f325a64452d78dff9469145e277  ${{targets.destdir}}/usr/bin/kubectl" | sha256sum -c -
      chmod 0755 "${{targets.destdir}}/usr/bin/kubectl"

      curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o kubelogin.zip \
        "https://github.com/Azure/kubelogin/releases/download/v0.2.16/kubelogin-linux-amd64.zip"
      echo "82772946d7424f8ff3b3e6e13509c985a70c2f2d5d1918175bab288923b37f9b  kubelogin.zip" | sha256sum -c -
      unzip -q kubelogin.zip
      install -m 0755 bin/linux_amd64/kubelogin "${{targets.destdir}}/usr/bin/kubelogin"

      curl -fsSL -o terraform.zip \
        "https://releases.hashicorp.com/terraform/1.14.7/terraform_1.14.7_linux_amd64.zip"
      echo "e8bbcefea8015156e04e2a325cde37a0b2fb761728bda548e2fe3b8ad7c18c96  terraform.zip" | sha256sum -c -
      unzip -q terraform.zip
      install -m 0755 terraform "${{targets.destdir}}/usr/bin/terraform"

      curl -fsSL -o "${{targets.destdir}}/usr/bin/vendir" \
        "https://github.com/carvel-dev/vendir/releases/download/v0.45.2/vendir-linux-amd64"
      echo "ecd053b031fdebfe0486b263a7071320b033f60b6d9e6c6b74ad681f2d7068b5  ${{targets.destdir}}/usr/bin/vendir" | sha256sum -c -
      chmod 0755 "${{targets.destdir}}/usr/bin/vendir"

      curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o kluctl.tar.gz \
        "https://github.com/kluctl/kluctl/releases/download/v2.27.0/kluctl_v2.27.0_linux_amd64.tar.gz"
      echo "7b325b5c0e422da49bb54fb8a3ca3d7fddfcdeb220b9f0d4bc36625ece2eb9ae  kluctl.tar.gz" | sha256sum -c -
      tar -xzf kluctl.tar.gz
      install -m 0755 kluctl "${{targets.destdir}}/usr/bin/kluctl"

      python3 -m pip install \
        --break-system-packages \
        --no-cache-dir \
        --prefer-binary \
        --prefix /usr \
        --root "${{targets.destdir}}" \
        azure-cli==2.84.0


name: Build Azure DevOps Agent Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build-apko:
    name: Build with melange + apko
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Uncomment when re-enabling arm64 builds
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.6.8

      - name: Install apko
        env:
          APKO_VERSION: 1.1.14
        run: |
          curl -fsSL -o apko.tar.gz \
            "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf apko.tar.gz --strip-components=1 -C /usr/local/bin apko_${APKO_VERSION}_linux_amd64/apko
          rm apko.tar.gz

      - name: Generate signing key
        run: melange keygen

      - name: Build package
        run: melange build melange.yaml --arch amd64 --signing-key melange.rsa --out-dir packages

      - name: Build index
        run: melange index --signing-key melange.rsa packages/x86_64/*.apk

      # Uncomment when re-enabling arm64 builds
      # - name: Build index (arm64)
      #   run: melange index --signing-key melange.rsa packages/aarch64/*.apk

      - name: Build image
        run: apko build --arch amd64 apko.yaml azdo-agent:apko azdo-agent-apko.tar

      - name: Load image
        run: docker load -i azdo-agent-apko.tar

      - name: Scan image for vulnerabilities
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype azdo-agent:apko-amd64 --output table > grype-report.txt 2>&1 || true
          cat grype-report.txt

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: grype-vulnerability-report
          path: grype-report.txt
          if-no-files-found: warn

      - name: Verify image tools
        run: |
          docker run --rm --entrypoint /bin/bash azdo-agent:apko-amd64 -lc '
            set -e
            kubectl version --client
            az version
            terraform version
            vendir --version
            kluctl version
            melange version
          '

      # Uncomment when re-enabling arm64 builds
      # - name: Verify arm64 image tools
      #   run: |
      #     docker run --rm --platform linux/arm64 --entrypoint /bin/bash azdo-agent:apko-arm64 -lc '
      #       set -e
      #       kubectl version --client
      #       az version
      #       terraform version
      #       vendir --version
      #       kluctl version
      #       melange version
      #     '

  # Uncomment to re-enable the Dockerfile-based build as an alternative/fallback

annotations:
  "org.opencontainers.image.title": "azdo-agent"
  "org.opencontainers.image.description": "Azure DevOps self-hosted agent with pre-baked tools (kubectl, kubelogin, terraform, vendir, kluctl, az cli)"
  "org.opencontainers.image.licenses": "MIT"
  "org.opencontainers.image.vendor": "Feisty Eric"
  "org.opencontainers.image.source": "https://github.com/bjrooney/azdo_agent"

contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - ./packages
  packages:
    - azdo-agent-tools

accounts:
  groups:
    - groupname: agent
      gid: 1000
  users:
    - username: agent
      uid: 1000
      gid: 1000
  run-as: "1000"

work-dir: /azp

entrypoint:
  command: /azp/start.sh

environment:
  TARGETARCH: linux-musl-x64
  AGENT_ALLOW_RUNASROOT: "false"

archs:
  - amd64
  - arm64
